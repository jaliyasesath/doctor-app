name: doctor_app
description: Doctor Prescription & OPD Management App
publish_to: "none"

version: 1.1.1+14

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # NETWORK / API
  http: ^1.2.2
  signalr_netcore: ^1.4.4

  # DATABASE
  # SQLCipher-backed drop-in replacement for sqflite on Android/iOS/macOS.
  # Windows uses a separate encrypted adapter in the desktop milestone.
  sqflite_sqlcipher: ^3.4.1
  # Windows database adapter. sqlite3 is built with SQLite3 Multiple Ciphers;
  # the adapter selects its SQLCipher-compatible AES-256 scheme before opening.
  # Pinned to the newest releases compatible with the current Dart 3.11 SDK.
  sqflite_common_ffi: 2.4.0+3
  sqlite3: 3.5.2
  path: ^1.9.0

  # LOCAL STORAGE
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # NETWORK CHECK
  connectivity_plus: ^6.0.5

  # LOCAL HOTSPOT SERVER
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # LOCAL IP DETECTION
  network_info_plus: ^5.0.3

  # DEVICE INFO
  device_info_plus: ^10.1.0

  # BIOMETRIC AUTH
  local_auth: ^3.0.1

  # QR
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # SHARE / URL
  share_plus: ^7.2.1
  url_launcher: ^6.3.1

  # BLUETOOTH PRINTER
  print_bluetooth_thermal: 1.2.1
  esc_pos_utils_plus: ^2.0.4

  # PDF
  pdf: ^3.10.8
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # IMAGE PICKER
  image_picker: ^1.1.2

  # MEDICAL CENTRE GPS
  geolocator: ^13.0.2

  # DATE / FORMAT
  intl: ^0.19.0

  # LOCAL NOTIFICATIONS
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aa.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/private_practices_logo.jpeg
    - assets/images/app_icon.png

# sqlite3 3.5.2 (the Dart 3.11-compatible release) provides the encrypted
# SQLite3 Multiple Ciphers native build. The Windows adapter explicitly selects
# its SQLCipher-compatible AES-256 scheme before applying the database key.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
